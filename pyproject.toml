[project]
name = "culprit"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rahilmavani", email = "mavanirahil6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "jinja2>=3.1.6",
    "neatlogs[anthropic]>=1.4.26",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
culprit = "culprit:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
