[project]
name = "culprit-cli"
version = "0.1.0"
description = "git bisect for AI agent behaviour: find the commit that made your agent worse, with statistics, and verify a fix."
readme = "PYPI.md"
authors = [
    { name = "rahilmavani", email = "mavanirahil6@gmail.com" },
    { name = "Ayush", email = "ayushgml@gmail.com" },
]
keywords = ["llm", "agents", "evals", "git-bisect", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "jinja2>=3.1.6",
    "neatlogs[anthropic]>=1.4.26",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://culprit-site.vercel.app"

[project.scripts]
culprit = "culprit:main"
culprit-cli = "culprit:main"  # so `uvx culprit-cli` works without --from

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "culprit"  # the distribution is culprit-cli; the import name and command stay culprit

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
